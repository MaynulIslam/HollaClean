services:
  - type: web
    name: hollaclean-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://www.hollaclean.com
      - key: PLATFORM_FEE_PERCENT
        value: 20
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
